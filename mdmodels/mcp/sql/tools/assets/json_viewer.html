<!DOCTYPE html>
<html>
<head>
  <meta name="color-scheme" content="light dark">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: transparent;
      color: #0f172a;
      min-height: 100vh;
      padding: 0;
    }

    /* ── Toolbar ───────────────────────────────────────────────── */
    #toolbar {
      display: none;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px 10px;
      position: sticky;
      top: 0;
      z-index: 10;
      background: transparent;
      border-bottom: 1px solid rgba(0,0,0,0.08);
      margin-bottom: 6px;
    }

    #title {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #9b9b93;                                        /* Claude light muted */
    }

    #btn-copy {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      font-size: 12.5px;
      font-weight: 500;
      border-radius: 8px;
      border: 1px solid rgba(0,0,0,0.12);
      background: rgba(0,0,0,0.04);
      color: #6b6b63;                                        /* Claude light secondary text */
      cursor: pointer;
      transition: all 0.15s ease;
      letter-spacing: 0.01em;
    }
    #btn-copy:hover {
      background: rgba(0,0,0,0.08);
      border-color: rgba(0,0,0,0.2);
      color: #1a1a17;
    }
    #btn-copy.success {
      background: rgba(34,197,94,0.08);
      border-color: rgba(34,197,94,0.3);
      color: #16a34a;
    }

    @media (prefers-color-scheme: dark) {
      body { color: #ccccc4; }                               /* Claude prose text */
      #toolbar { border-bottom-color: rgba(255,255,255,0.06); }
      #title { color: #6b7280; font-weight: 600; }           /* Claude muted label */
      #btn-copy {
        border-color: rgba(255,255,255,0.12);
        background: rgba(255,255,255,0.05);
        color: #9b9b93;
        border-radius: 8px;
      }
      #btn-copy:hover {
        background: rgba(255,255,255,0.09);
        border-color: rgba(255,255,255,0.2);
        color: #ccccc4;
      }
      #btn-copy.success {
        background: rgba(34,197,94,0.1);
        border-color: rgba(34,197,94,0.25);
        color: #4ade80;
      }
    }

    /* ── Tree container ────────────────────────────────────────── */
    #tree {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14.5px;
      line-height: 1.75;
      padding: 6px 16px 24px;
      letter-spacing: -0.01em;
    }

    #placeholder {
      color: rgba(148,163,184,0.4);
      font-size: 14px;
      text-align: center;
      padding: 48px 16px;
      font-family: inherit;
    }

    /* ── Node types ────────────────────────────────────────────── */
    .jv-row {
      display: flex;
      align-items: baseline;
      gap: 0;
      min-height: 1.75em;
    }

    .jv-key     { color: #1e293b; flex-shrink: 0; font-weight: 600; } /* slate-900 light */
    .jv-colon   { color: rgba(100,116,139,0.5); margin-right: 0.5em; flex-shrink: 0; }
    .jv-string  { color: #16a34a; }                           /* green-700 light */
    .jv-number  { color: #ea580c; }                           /* orange-600 light */
    .jv-boolean { color: #7c3aed; }                           /* violet-600 light */
    .jv-null    { color: #94a3b8; font-style: italic; }
    .jv-comma   { color: rgba(100,116,139,0.3); }

    @media (prefers-color-scheme: dark) {
      .jv-key     { color: #e2e8f0; }                         /* slate-200 dark  */
      .jv-string  { color: #4ade80; }                         /* green-400 dark  */
      .jv-number  { color: #fb923c; }                         /* orange-400 dark */
      .jv-boolean { color: #a78bfa; }                         /* violet-400 dark */
      .jv-null    { color: #64748b; }
      .jv-colon   { color: rgba(148,163,184,0.4); }
      .jv-comma   { color: rgba(148,163,184,0.25); }
    }

    /* ── Collapsible nodes ─────────────────────────────────────── */
    .jv-toggle {
      cursor: pointer;
      user-select: none;
      display: inline-flex;
      align-items: baseline;
      gap: 0;
    }
    .jv-arrow {
      display: inline-block;
      width: 16px;
      font-size: 10px;
      color: rgba(148,163,184,0.4);
      transition: transform 0.15s ease;
      transform-origin: 40% 50%;
      flex-shrink: 0;
    }
    .jv-toggle.collapsed .jv-arrow { transform: rotate(-90deg); }

    .jv-bracket { color: rgba(148,163,184,0.5); }

    .jv-preview {
      font-size: 12px;
      color: rgba(148,163,184,0.4);
      margin-left: 6px;
    }

    .jv-children {
      padding-left: 22px;
      border-left: 1px solid rgba(148,163,184,0.12);
      margin-left: 6px;
    }
    .jv-children.hidden { display: none; }

    .jv-closing {
      color: rgba(148,163,184,0.45);
    }
  </style>
</head>
<body>

  <div id="toolbar">
    <span id="title">Entry</span>
    <button id="btn-copy">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="9" width="13" height="13" rx="2.5"/>
        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
      </svg>
      <span>Copy to clipboard</span>
    </button>
  </div>

  <div id="tree"><div id="placeholder">Waiting for data…</div></div>

  <script type="module">
    import { App } from "https://unpkg.com/@modelcontextprotocol/ext-apps@0.4.0/app-with-deps";

    const app = new App({ name: "JSON Viewer", version: "1.0.0" });
    let rawData = null;

    /* ── Tree builder ───────────────────────────────────────────── */

    function el(tag, cls) {
      const e = document.createElement(tag);
      if (cls) e.className = cls;
      return e;
    }
    function txt(node, text) { node.appendChild(document.createTextNode(text)); return node; }
    function span(cls, text) { return txt(el("span", cls), text); }

    function buildValue(val, isLast) {
      const comma = isLast ? "" : ",";

      if (val === null)
        return [span("jv-null", "null"), span("jv-comma", comma)];
      if (typeof val === "boolean")
        return [span("jv-boolean", String(val)), span("jv-comma", comma)];
      if (typeof val === "number")
        return [span("jv-number", String(val)), span("jv-comma", comma)];
      if (typeof val === "string")
        return [span("jv-string", JSON.stringify(val)), span("jv-comma", comma)];
      if (Array.isArray(val))
        return buildArray(val, comma);
      if (typeof val === "object")
        return buildObject(val, comma);
      return [span("", String(val)), span("jv-comma", comma)];
    }

    function buildObject(obj, comma = "") {
      const keys = Object.keys(obj);
      if (keys.length === 0)
        return [span("jv-bracket", "{}"), span("jv-comma", comma)];

      const wrapper  = el("div");
      const toggle   = el("span", "jv-toggle");
      const arrow    = span("jv-arrow", "▾");
      const openBr   = span("jv-bracket", "{");
      const preview  = span("jv-preview", keys.length + (keys.length === 1 ? " key" : " keys"));

      toggle.appendChild(arrow);
      toggle.appendChild(openBr);
      toggle.appendChild(preview);

      const children = el("div", "jv-children");
      keys.forEach((k, i) => {
        const row = el("div", "jv-row");
        row.appendChild(span("jv-key", JSON.stringify(k)));
        row.appendChild(span("jv-colon", ":"));
        const parts = buildValue(obj[k], i === keys.length - 1);
        parts.forEach(p => row.appendChild(p));
        children.appendChild(row);
      });

      const closing = el("div");
      closing.appendChild(span("jv-closing", "}"));
      closing.appendChild(span("jv-comma", comma));

      toggle.onclick = () => {
        const hidden = children.classList.toggle("hidden");
        toggle.classList.toggle("collapsed", hidden);
        preview.style.display = hidden ? "inline" : "none";
      };
      preview.style.display = "none";

      wrapper.appendChild(toggle);
      wrapper.appendChild(children);
      wrapper.appendChild(closing);
      return [wrapper];
    }

    function buildArray(arr, comma = "") {
      if (arr.length === 0)
        return [span("jv-bracket", "[]"), span("jv-comma", comma)];

      const wrapper  = el("div");
      const toggle   = el("span", "jv-toggle");
      const arrow    = span("jv-arrow", "▾");
      const openBr   = span("jv-bracket", "[");
      const preview  = span("jv-preview", arr.length + (arr.length === 1 ? " item" : " items"));

      toggle.appendChild(arrow);
      toggle.appendChild(openBr);
      toggle.appendChild(preview);

      const children = el("div", "jv-children");
      arr.forEach((item, i) => {
        const row = el("div", "jv-row");
        const parts = buildValue(item, i === arr.length - 1);
        parts.forEach(p => row.appendChild(p));
        children.appendChild(row);
      });

      const closing = el("div");
      closing.appendChild(span("jv-closing", "]"));
      closing.appendChild(span("jv-comma", comma));

      toggle.onclick = () => {
        const hidden = children.classList.toggle("hidden");
        toggle.classList.toggle("collapsed", hidden);
        preview.style.display = hidden ? "inline" : "none";
      };
      preview.style.display = "none";

      wrapper.appendChild(toggle);
      wrapper.appendChild(children);
      wrapper.appendChild(closing);
      return [wrapper];
    }

    /* ── MCP wiring ─────────────────────────────────────────────── */

    app.ontoolresult = ({ content }) => {
      const text = content?.find(c => c.type === "text");
      if (!text) return;

      try {
        const parsed = JSON.parse(text.text);
        rawData       = parsed.data !== undefined ? parsed.data : parsed;
        const meta    = parsed._meta || {};
        const label   = meta.table
          ? (meta.table.toUpperCase() + (meta.id != null ? "  ·  ID " + meta.id : ""))
          : "Entry";

        document.getElementById("title").textContent = label;
        document.getElementById("placeholder").remove();

        const tree = document.getElementById("tree");
        buildObject(rawData).forEach(n => tree.appendChild(n));

        document.getElementById("toolbar").style.display = "flex";
      } catch (e) {
        document.getElementById("placeholder").textContent = text.text;
        document.getElementById("toolbar").style.display = "flex";
      }
    };

    await app.connect();

    /* ── Copy button ────────────────────────────────────────────── */
    document.getElementById("btn-copy").onclick = async () => {
      if (rawData === null) return;
      const btn   = document.getElementById("btn-copy");
      const label = btn.querySelector("span");
      try {
        await navigator.clipboard.writeText(JSON.stringify(rawData, null, 2));
        btn.classList.add("success");
        label.textContent = "Copied!";
        setTimeout(() => {
          btn.classList.remove("success");
          label.textContent = "Copy to clipboard";
        }, 2000);
      } catch {
        const range = document.createRange();
        range.selectNodeContents(document.getElementById("tree"));
        window.getSelection().removeAllRanges();
        window.getSelection().addRange(range);
      }
    };
  </script>
</body>
</html>
