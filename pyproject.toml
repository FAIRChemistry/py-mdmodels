[project]
name = "mdmodels"
version = "0.3.0"
description = "Python package for the MDModels Rust crate"
authors = [{ name = "Jan Range", email = "range.jan@web.de" }]
requires-python = ">=3.11"
readme = "README.md"
license = "MIT"
dependencies = [
    "mdmodels-core>=0.2.9,<0.3",
    "pydantic-xml>=2.12.1,<3",
    "bigtree>=0.21.1,<0.22",
    "validators>=0.34.0,<0.35",
    "httpx>=0.28,<0.29",
    "python-jsonpath>=1.2.0,<2",
    "rich>=13.9.4,<14",
    "nest-asyncio>=1.6.0,<2",
    "dotted-dict>=1.1.3,<2",
    "python-forge>=18.6.0,<19",
    "toml>=0.10.2",
    "typer>=0.20.0",
    "dotenv>=0.9.9",
    "pandas>=2.2.3",
    "astropy>=6.1.7",
    "polars>=1.39.3",
    "fastexcel>=0.19.0",
]

[project.scripts]
mdmodels = "mdmodels.cli:app"

[project.optional-dependencies]
chat = ["openai>=1.57.0,<2", "tabulate>=0.9.0,<0.10"]
graph = ["neomodel>=5.4.0,<6"]
postgres = ["psycopg2-binary>=2.9.11", "sqlmodel>=0.0.22,<0.0.23"]
mcp = ["fastmcp[apps]>=3.2.0", "toon-format==0.9.0b1"]
rest = ["fastapi>=0.123.8", "pyyaml>=6.0.3", "uvicorn>=0.38.0"]
graphql = ["strawberry-graphql>=0.296.0", "uvicorn>=0.38.0"]
mysql = ["pymysql>=1.1.2", "sqlmodel>=0.0.22"]
sqlserver = ["pyodbc>=5.3.0", "sqlmodel>=0.0.22"]
pgvector = [
    "fastembed>=0.7.3",
    "pgvector>=0.4.1",
    "psycopg2-binary>=2.9.11",
    "sentence-transformers>=2.2.2,<3",
    "sqlmodel>=0.0.22,<0.0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"mdmodels/mcp/sql/tools/assets/plot_viewer.html" = "mdmodels/mcp/sql/tools/assets/plot_viewer.html"
"mdmodels/mcp/sql/tools/assets/downloader.html" = "mdmodels/mcp/sql/tools/assets/downloader.html"
"mdmodels/mcp/sql/tools/assets/data_entry_form.html" = "mdmodels/mcp/sql/tools/assets/data_entry_form.html"


[tool.pytest.ini_options]
markers = [
    "expensive: marks tests as expensive (deselect with '-m \"not expensive\"')",
]

[dependency-groups]
dev = [
    "alembic>=1.16.5",
    "pytest-cov>=6.3.0",
    "pytest-httpx>=0.35.0",
    "pytest-sugar>=1.1.1",
]

[[tool.uv.index]]
explicit = true
name = "testpypi"
publish-url = "https://test.pypi.org/legacy/"
url = "https://test.pypi.org/simple/"

[tool.uv]
prerelease = "explicit"
